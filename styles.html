<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mallow Pop – music style preview</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: linear-gradient(#cfeaff, #ffe0f0); color: #5a2d91; min-height: 100vh; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { color: #e0508f; margin: 0 0 4px; font-size: 26px; }
  p { margin: 6px 0 14px; line-height: 1.45; }
  .styles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .st { background: #fff; border: 3px solid #e9d6ff; border-radius: 16px; padding: 12px; cursor: pointer; }
  .st.on { border-color: #ff5fa2; background: #fff0f7; }
  .st b { display: block; font-size: 17px; color: #e0508f; }
  .st span { font-size: 13px; }
  label { display: block; margin: 14px 0 4px; font-weight: 700; }
  select, input[type=range] { width: 100%; font-size: 16px; }
  .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button { font-size: 18px; font-weight: 800; border: 0; border-radius: 99px; padding: 12px 22px; color: #fff; background: #ff5fa2; cursor: pointer; }
  button.alt { background: #8a5bd6; }
  .modes { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .modes label { font-weight: 400; margin: 0; }
  #now { margin-top: 12px; font-size: 14px; min-height: 1.4em; }
  @media (max-width: 480px) { .styles { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Mallow Pop – music styles</h1>
  <p>Pick a style and a song, then press Play. These are the game's own songs played by the same kind of synth the game uses (no audio files). Use headphones if you can.</p>
  <div class="styles" id="styles"></div>

  <label for="song">Song</label>
  <select id="song"></select>

  <label for="bpm">Tempo: <span id="bpmv">112</span> bpm</label>
  <input id="bpm" type="range" min="90" max="170" step="2" value="112">

  <label>Melody</label>
  <div class="modes">
    <label><input type="radio" name="mode" value="full" checked> Full song (perfect play)</label>
    <label><input type="radio" name="mode" value="player"> Player plays the melody: notes snap to the beat (new design), 1 in 8 notes missed</label>
    <label><input type="radio" name="mode" value="old"> Like v1.2 now: melody off, random in-scale blips at loose timing</label>
    <label><input type="radio" name="mode" value="backing"> Backing only (no melody)</label>
  </div>

  <div class="row">
    <button id="play">▶ Play</button>
    <button id="stop" class="alt">■ Stop</button>
  </div>
  <div id="now"></div>
</main>
<script>window.MP = window.MP || {};</script>
<script src="js/songs.js"></script>
<script>
(function () {
  var STYLES = [
    { id: 'nes', name: 'A. NES Classic', desc: 'Crisp pulse waves, triangle bass, noise drums. Dry and punchy, like classic 8-bit consoles.' },
    { id: 'soft', name: 'B. Soft Chip', desc: 'Same chip voices but rounded: filtered, chorus, echo and reverb. Cosy, lo-fi, easy on the ears.' },
    { id: 'box', name: 'C. Music Box', desc: 'Bell lead, marimba chords, soft plucked bass, wooden percussion. Cute and toy-like.' },
    { id: 'pop', name: 'D. Synth Pop', desc: 'Bright detuned lead, chord pads, punchy drums, echo. Modern, upbeat and energetic.' }
  ];
  var style = 'soft', ctx = null, master, dry, revSend, echoSend, timer = null, step = 0, nextT = 0, song = null, playing = false;

  function $(id) { return document.getElementById(id); }
  function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  function mode() { var r = document.querySelector('input[name=mode]:checked'); return r ? r.value : 'full'; }

  STYLES.forEach(function (s) {
    var d = document.createElement('div');
    d.className = 'st' + (s.id === style ? ' on' : '');
    d.innerHTML = '<b></b><span></span>';
    d.querySelector('b').textContent = s.name; d.querySelector('span').textContent = s.desc;
    d.onclick = function () { style = s.id; [].forEach.call(document.querySelectorAll('.st'), function (e) { e.classList.remove('on'); }); d.classList.add('on'); info(); };
    $('styles').appendChild(d);
  });
  var ZN = ['Marshmallow Meadow', 'Candy Clouds', 'Jelly Lake', 'Sprinkle Sky', 'Starlight Sundae', 'Rainbow Road'];
  MP.songs.list.forEach(function (s, i) {
    var o = document.createElement('option'); o.value = i; o.textContent = ZN[s.zone] + ' – ' + s.name; $('song').appendChild(o);
  });
  $('bpm').oninput = function () { $('bpmv').textContent = this.value; };

  function ensure() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.5;
    var comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);
    var an = ctx.createAnalyser(); an.fftSize = 2048; comp.connect(an); window.__meter = function () { var b = new Float32Array(an.fftSize); an.getFloatTimeDomainData(b); var r = 0, pk = 0; for (var i = 0; i < b.length; i++) { r += b[i] * b[i]; pk = Math.max(pk, Math.abs(b[i])); } return [Math.sqrt(r / b.length), pk]; };
    dry = ctx.createGain(); dry.connect(master);
    // reverb: generated impulse response
    var len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) { var ch = ir.getChannelData(c); for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    var conv = ctx.createConvolver(); conv.buffer = ir;
    revSend = ctx.createGain(); revSend.connect(conv); var rg = ctx.createGain(); rg.gain.value = 0.55; conv.connect(rg); rg.connect(master);
    // echo
    echoSend = ctx.createGain();
    var dl = ctx.createDelay(1), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 3000; fb.gain.value = 0.32;
    echoSend.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
    echoSend.dl = dl;
  }

  var pulseCache = {};
  function pulse(duty) {
    if (pulseCache[duty]) return pulseCache[duty];
    var n = 32, re = new Float32Array(n), im = new Float32Array(n);
    // Fourier series of a pulse wave with the given duty cycle
    for (var k = 1; k < n; k++) { re[k] = Math.sin(2 * Math.PI * k * duty) / (k * Math.PI); im[k] = (1 - Math.cos(2 * Math.PI * k * duty)) / (k * Math.PI); }
    return (pulseCache[duty] = ctx.createPeriodicWave(re, im));
  }
  function sends(node, rev, echo) {
    node.connect(dry);
    if (rev) { var a = ctx.createGain(); a.gain.value = rev; node.connect(a); a.connect(revSend); }
    if (echo) { var b = ctx.createGain(); b.gain.value = echo; node.connect(b); b.connect(echoSend); }
  }
  function osc(type, f, t, dur, vol, o) {
    o = o || {};
    var g = ctx.createGain(), s = ctx.createOscillator(), out = g;
    if (type.duty) s.setPeriodicWave(pulse(type.duty)); else s.type = type;
    s.frequency.setValueAtTime(f, t);
    if (o.slide) s.frequency.exponentialRampToValueAtTime(o.slide, t + (o.slideT || dur));
    if (o.detune) s.detune.value = o.detune;
    if (o.vib) { var l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 5.5; lg.gain.value = f * o.vib; l.connect(lg); lg.connect(s.frequency); l.start(t + 0.12); l.stop(t + dur + 0.3); }
    var a = o.att || 0.005, r = o.rel || 0.05, sus = o.sus != null ? o.sus : 1;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    if (o.decay) g.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol * sus), t + a + o.decay);
    g.gain.setValueAtTime(Math.max(0.0001, vol * (o.decay ? sus : 1)), t + Math.max(a, dur));
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(a, dur) + r);
    if (o.lp) { var f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.setValueAtTime(o.lp, t); if (o.lpEnd) f2.frequency.exponentialRampToValueAtTime(o.lpEnd, t + dur); f2.Q.value = o.q || 0.7; g.connect(f2); out = f2; }
    s.connect(g); s.start(t); s.stop(t + Math.max(a, dur) + r + 0.05);
    return out;
  }
  var noiseBuf = null;
  function noise(t, dur, vol, f, type, rev) {
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    var s = ctx.createBufferSource(), g = ctx.createGain(), fl = ctx.createBiquadFilter();
    s.buffer = noiseBuf; fl.type = type || 'highpass'; fl.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); sends(g, rev || 0, 0); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function fm(f, t, dur, vol, ratio, index, rev, echo) {
    var c = ctx.createOscillator(), m = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain();
    c.type = 'sine'; m.type = 'sine'; c.frequency.value = f; m.frequency.value = f * ratio;
    mg.gain.setValueAtTime(f * index, t); mg.gain.exponentialRampToValueAtTime(f * 0.05, t + dur);
    m.connect(mg); mg.connect(c.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    c.connect(g); sends(g, rev, echo);
    c.start(t); m.start(t); c.stop(t + dur + 0.05); m.stop(t + dur + 0.05);
  }

  // one voice per role and style
  function lead(n, t, d) {
    var f = midi(n);
    if (style === 'nes') sends(osc({ duty: 0.25 }, f, t, d * 0.9, 0.16, { vib: 0.004, rel: 0.03 }), 0, 0);
    else if (style === 'soft') {
      var a = osc({ duty: 0.5 }, f, t, d * 0.95, 0.12, { att: 0.02, vib: 0.006, lp: 2400, rel: 0.12 });
      var b = osc({ duty: 0.5 }, f, t, d * 0.95, 0.06, { att: 0.02, detune: 9, lp: 2400, rel: 0.12 });
      sends(a, 0.35, 0.22); sends(b, 0.35, 0.22);
    } else if (style === 'box') { fm(f * 2, t, Math.max(0.9, d * 1.5), 0.17, 3.5, 2.2, 0.45, 0.2); fm(f * 4, t, 0.35, 0.03, 1, 1, 0.3, 0); }
    else {
      sends(osc('sawtooth', f, t, d * 0.9, 0.07, { detune: -8, att: 0.01, lp: 4500, lpEnd: 1800, rel: 0.1, vib: 0.004 }), 0.3, 0.3);
      sends(osc('sawtooth', f, t, d * 0.9, 0.07, { detune: 8, att: 0.01, lp: 4500, lpEnd: 1800, rel: 0.1 }), 0.3, 0.3);
    }
  }
  function bass(n, t, d) {
    var f = midi(n);
    if (style === 'nes') sends(osc('triangle', f, t, d * 0.9, 0.3, { rel: 0.02 }), 0, 0);
    else if (style === 'soft') { sends(osc('triangle', f, t, d * 0.9, 0.28, { att: 0.01, rel: 0.08 }), 0.08, 0); sends(osc('sine', f / 2, t, d * 0.9, 0.18, { att: 0.01, rel: 0.08 }), 0, 0); }
    else if (style === 'box') sends(osc('sine', f, t, Math.min(d, 0.5), 0.36, { decay: 0.35, sus: 0.2, rel: 0.12 }), 0.15, 0);
    else { sends(osc({ duty: 0.5 }, f, t, d * 0.8, 0.12, { lp: 900, rel: 0.04 }), 0, 0); sends(osc('sine', f / 2, t, d * 0.8, 0.2, { rel: 0.04 }), 0, 0); }
  }
  function arp(n, t, d) {
    var f = midi(n);
    if (style === 'nes') sends(osc({ duty: 0.125 }, f, t, d * 0.7, 0.045, { rel: 0.02 }), 0, 0);
    else if (style === 'soft') sends(osc('triangle', f, t, d * 0.8, 0.05, { att: 0.005, lp: 3000, rel: 0.08 }), 0.4, 0.15);
    else if (style === 'box') fm(f, t, 0.45, 0.07, 4, 1.2, 0.35, 0);
    else sends(osc({ duty: 0.25 }, f, t, d * 0.6, 0.035, { lp: 3500, rel: 0.05 }), 0.25, 0.3);
  }
  function pad(pcs, root, t, dur) {
    if (style !== 'pop' && style !== 'soft') return;
    pcs.forEach(function (pc) {
      var f = midi(48 + ((pc + 12) % 12) + 12);
      if (style === 'pop') sends(osc('sawtooth', f, t, dur, 0.025, { att: 0.25, lp: 1600, rel: 0.4, detune: 6 }), 0.5, 0);
      else sends(osc('triangle', f, t, dur, 0.03, { att: 0.3, rel: 0.5 }), 0.6, 0);
    });
  }
  function drums(d, t, big) {
    var v = style === 'box' ? 0.6 : style === 'soft' ? 0.75 : 1;
    if (d & 1) {
      if (style === 'box') sends(osc('sine', 120, t, 0.12, 0.35, { slide: 60, slideT: 0.1 }), 0.1, 0);
      else sends(osc('sine', style === 'pop' ? 160 : 150, t, 0.16, 0.8 * v, { slide: 42, slideT: 0.14 }), 0, 0);
    }
    if (d & 2) {
      if (style === 'box') { sends(osc('sine', 820, t, 0.06, 0.12, { slide: 600, slideT: 0.05 }), 0.2, 0); noise(t, 0.05, 0.06, 3000, 'bandpass', 0.2); }
      else { noise(t, 0.13, 0.28 * v, style === 'pop' ? 1600 : 2200, 'highpass', style === 'nes' ? 0 : 0.3); sends(osc('triangle', 190, t, 0.07, 0.2 * v, { slide: 140 }), 0, 0); }
    }
    if (d & 4) noise(t, style === 'box' ? 0.03 : 0.035, (style === 'box' ? 0.04 : 0.08) * v, style === 'box' ? 6000 : 8000, 'highpass', 0);
    if (d & 8) noise(t, 0.14, 0.07 * v, 7000, 'highpass', 0.1);
    if ((d & 16) && big) noise(t, 0.6, 0.08 * v, 5000, 'highpass', 0.4);
  }

  var rng = 1;
  function rnd() { rng = (rng * 16807) % 2147483647; return rng / 2147483647; }
  function schedule() {
    var bpm = +$('bpm').value, sp = 60 / bpm / 4, m = mode();
    echoSend.dl.delayTime.value = sp * 3;
    while (nextT < ctx.currentTime + 0.15) {
      var i = step % song.steps, t = nextT, s = song;
      if (i % 8 === 0) { var ci = Math.floor(i / 8); if (s.chordPcs[ci]) pad(s.chordPcs[ci], s.tonic, t, sp * 8 * 0.98); }
      if (s.bass[i]) bass(s.bass[i], t, s.bassDur[i] * sp);
      if (s.arp[i]) arp(s.arp[i], t, s.arpDur[i] * sp);
      if (s.drum[i]) drums(s.drum[i], t, i % 64 === 0);
      if (s.lead[i]) {
        if (m === 'full') lead(s.lead[i], t, s.leadDur[i] * sp);
        else if (m === 'player') { if (rnd() > 0.125) lead(s.lead[i], t, s.leadDur[i] * sp); }
        else if (m === 'old' && rnd() < 0.6) {
          var pen = s.penta, nn = s.tonic + 12 + pen[(rnd() * pen.length) | 0];
          var off = (rnd() - 0.5) * 0.12;
          sends(osc('square', midi(nn), Math.max(ctx.currentTime, t + off), 0.08, 0.06, { rel: 0.03 }), 0, 0);
        }
      }
      nextT += sp; step++;
    }
  }
  function info() {
    if (!song) return;
    var st = STYLES.filter(function (x) { return x.id === style; })[0];
    $('now').textContent = (playing ? 'Playing: ' : 'Ready: ') + song.name + ' – ' + st.name + ' (key ' + ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'][song.key] + ' ' + song.mode + ')';
  }
  $('play').onclick = function () {
    ensure(); if (ctx.state === 'suspended') ctx.resume();
    song = MP.songs.list[+$('song').value]; step = 0; rng = 7; nextT = ctx.currentTime + 0.1; playing = true;
    clearInterval(timer); timer = setInterval(schedule, 25); schedule(); info();
  };
  $('stop').onclick = function () { clearInterval(timer); timer = null; playing = false; info(); };
  $('song').onchange = function () { if (playing) $('play').onclick(); };
  song = MP.songs.list[0]; info();
})();
</script>
</body>
</html>
