<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mallow Pop – music style preview</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: linear-gradient(#cfeaff, #ffe0f0); color: #5a2d91; min-height: 100vh; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { color: #e0508f; margin: 0 0 4px; font-size: 26px; }
  p { margin: 6px 0 14px; line-height: 1.45; }
  .styles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .st { background: #fff; border: 3px solid #e9d6ff; border-radius: 16px; padding: 12px; cursor: pointer; }
  .st.on { border-color: #ff5fa2; background: #fff0f7; }
  .st b { display: block; font-size: 17px; color: #e0508f; }
  .st span { font-size: 13px; }
  label { display: block; margin: 14px 0 4px; font-weight: 700; }
  select, input[type=range] { width: 100%; font-size: 16px; }
  .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button { font-size: 18px; font-weight: 800; border: 0; border-radius: 99px; padding: 12px 22px; color: #fff; background: #ff5fa2; cursor: pointer; }
  button.alt { background: #8a5bd6; }
  .fx button { font-size: 14px; padding: 8px 14px; background: #b58be8; }
  .modes { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .modes label, .opts label { font-weight: 400; margin: 0; }
  .opts { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
  #now { margin-top: 12px; font-size: 14px; min-height: 2.8em; }
  #err { color: #c0392b; font-weight: 700; }
  @media (max-width: 480px) { .styles { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Mallow Pop – music styles</h1>
  <p>This page plays the game's real music engine and songs (no audio files). In the game, the gates come from the
    melody: each gate you clear plays its melody note, snapped to the beat. Use headphones, or try it on a phone speaker too.</p>
  <div id="err"></div>
  <div class="styles" id="styles"></div>

  <label for="song">Song</label>
  <select id="song"></select>

  <label for="bpm">Tempo: <span id="bpmv">112</span> bpm</label>
  <input id="bpm" type="range" min="90" max="170" step="2" value="112">

  <label>Melody</label>
  <div class="modes">
    <label><input type="radio" name="mode" value="player" checked> Player: about 70% of the notes are gates, 1 in 8 missed, taps up to 60 ms early or 80 ms late (early notes snap to the beat), with game sound effects</label>
    <label><input type="radio" name="mode" value="perfect"> Perfect play: every melody note is a gate, all cleared</label>
    <label><input type="radio" name="mode" value="full"> No player: the backing plays the whole melody as quiet filler notes</label>
    <label><input type="radio" name="mode" value="backing"> Backing only (every melody note is a gate, none played)</label>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="rush"> Sugar Rush (brighter, key up, 10% faster)</label>
    <label><input type="checkbox" id="sfx" checked> Game sound effects in player mode</label>
  </div>

  <div class="row">
    <button id="play">▶ Play</button>
    <button id="stop" class="alt">■ Stop</button>
  </div>
  <div id="now"></div>

  <label>Sound effects (current style and key)</label>
  <div class="row fx" id="fx"></div>
</main>
<script>window.MP = window.MP || {};</script>
<script>
(function () {
  // load the engine from js/ (deployed next to the game) or ../game/js/ (local checkout)
  var files = ['songs.js', 'audio.js'], bases = ['js/', '../game/js/'];
  function load(i, b) {
    if (i >= files.length) { init(); return; }
    var s = document.createElement('script');
    s.src = bases[b] + files[i];
    s.onload = function () { load(i + 1, b); };
    s.onerror = function () {
      s.parentNode.removeChild(s);
      if (b + 1 < bases.length) load(i, b + 1);
      else document.getElementById('err').textContent = 'Could not load the game scripts (' + files[i] + ').';
    };
    document.head.appendChild(s);
  }
  load(0, 0);

  function init() {
    var A = MP.audio, SONGS = MP.songs;
    var STYLES = [
      { id: 'box', name: 'Music Box', desc: 'Bell melody, marimba chords, soft plucked bass, wooden percussion. Cute and toy-like. (default)' },
      { id: 'soft', name: 'Soft Chip', desc: 'Rounded chip voices: filtered squares, chorus, echo and reverb. Cosy and lo-fi.' },
      { id: 'pop', name: 'Synth Pop', desc: 'Bright detuned saw lead, chord pads, punchy drums, echo. Upbeat and energetic.' },
      { id: 'auto', name: 'Auto', desc: 'Changes with the zone: Music Box in zones 1–3, Soft Chip in zone 4, Synth Pop in zones 5–6.' }
    ];
    var ZN = ['Marshmallow Meadow', 'Candy Clouds', 'Jelly Lake', 'Sprinkle Sky', 'Starlight Sundae', 'Rainbow Road'];
    var ZBPM = [100, 112, 124, 136, 148, 160];
    var NAMES = { box: 'Music Box', soft: 'Soft Chip', pop: 'Synth Pop' };
    var style = 'box', song = null, playing = false, timer = null;
    var t0 = 0, bpm = 112, segs = [], scan = 0, events = [], stats = { hit: 0, miss: 0, fill: 0 };
    var seed = 7;
    function $(id) { return document.getElementById(id); }
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    function mode() { var r = document.querySelector('input[name=mode]:checked'); return r ? r.value : 'player'; }

    STYLES.forEach(function (s) {
      var d = document.createElement('div');
      d.className = 'st' + (s.id === style ? ' on' : '');
      d.innerHTML = '<b></b><span></span>';
      d.querySelector('b').textContent = s.name; d.querySelector('span').textContent = s.desc;
      d.onclick = function () {
        style = s.id;
        [].forEach.call(document.querySelectorAll('.st'), function (e) { e.classList.remove('on'); });
        d.classList.add('on');
        A.unlock();
        if (song) A.setZone(song.zone);
        if (playing) A.setStyle(style); // lands on the next bar line
        else if (A.previewStyle) A.previewStyle(style); else A.setStyle(style);
        info();
      };
      $('styles').appendChild(d);
    });
    SONGS.list.forEach(function (s, i) {
      var o = document.createElement('option'); o.value = i; o.textContent = ZN[s.zone] + ' – ' + s.name; $('song').appendChild(o);
    });
    song = SONGS.list[0];

    function curBpm() { return bpm * ($('rush').checked ? 1.1 : 1); }
    function ctxNow() { return A.context ? A.context.currentTime : 0; }
    function beatNow() { return (ctxNow() - t0) * curBpm() / 60; }
    function songAt(k) { var s = segs[0]; for (var i = 0; i < segs.length; i++) if (segs[i].start <= k) s = segs[i]; return s; }
    function timeOfBeat(b) { return t0 + b * 60 / curBpm(); }

    $('bpm').oninput = function () {
      var b = playing ? beatNow() : 0;
      bpm = +this.value; $('bpmv').textContent = bpm;
      if (playing) t0 = ctxNow() - b * 60 / curBpm(); // keep the beat continuous
    };
    $('rush').onchange = function () {
      var b = playing ? beatNow() : 0, on = this.checked;
      A.setRush(on);
      if (playing) t0 = ctxNow() - b * 60 / curBpm();
      if (on && playing) A.chime();
      info();
    };

    // gates for steps up to 2 beats ahead: own them, plan the tap (or the miss)
    function plan(limitStep) {
      var m = mode();
      while (scan <= limitStep) {
        var k = scan++, sg = songAt(k), s = sg.song, i = ((k - sg.start) % s.steps + s.steps) % s.steps;
        if (!s.lead[i] || m === 'full') continue;
        var gate = m !== 'player' || rnd() < 0.7;
        if (!gate) continue;
        A.ownStep(k);
        if (m === 'backing') continue;
        var miss = m === 'player' && rnd() < 0.125;
        var jit = m === 'player' ? (rnd() - 0.43) * 0.14 : -0.03;
        var kinds = ['perfect', 'great', 'perfect', 'good', 'hole', 'great'];
        events.push({ b: k / 4, jit: jit, k: k, m: s.lead[i], beats: s.leadDur[i] / 4, miss: miss, kind: m === 'perfect' ? 'perfect' : kinds[(k * 5) % kinds.length], type: 'gate' });
        if (m === 'player' && $('sfx').checked && !miss) events.push({ b: k / 4, jit: -0.17, type: 'puff' });
        if (m === 'player' && !miss && s.leadDur[i] >= 6) {
          for (var h = 1; h * 0.5 < s.leadDur[i] / 4; h++) events.push({ b: k / 4 + h * 0.5, jit: 0.01, type: 'tick', n: h });
        }
      }
    }

    function fire(e) {
      if (e.type === 'puff') { A.puff(); return; }
      if (e.type === 'tick') { A.tickNote(e.b, e.n); return; }
      if (e.miss) { A.missNote(e.k); stats.miss++; return; }
      A.hitNote(e.k, e.m, e.beats, e.kind);
      stats.hit++;
      if (mode() === 'player' && $('sfx').checked) { if (e.kind !== 'hole') A.smash(3); if (e.kind === 'perfect') A.perfect(3); }
    }

    function tick() {
      if (!playing) return;
      var b = beatNow(), now = ctxNow();
      plan(Math.floor((b + 2) * 4));
      for (var i = 0; i < events.length; i++) {
        var e = events[i];
        if (timeOfBeat(e.b) + e.jit <= now) { events.splice(i, 1); i--; fire(e); }
      }
      if (b >= -0.05) A.musicTick(b, curBpm()); // from just before beat 0 (step 0 is in the lookahead)
      if (((b * 4) | 0) % 8 === 0) info();
    }

    function info() {
      if (!song) return;
      var st = A.getActiveStyle ? A.getActiveStyle() : style;
      var cur = playing ? songAt(Math.max(0, Math.floor(beatNow() * 4))).song : song;
      $('now').textContent = (playing ? 'Playing: ' : 'Ready: ') + cur.name + ' – ' + (NAMES[st] || st) + (style === 'auto' ? ' (Auto, zone ' + (cur.zone + 1) + ')' : '') +
        ' – key ' + ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'][cur.key] + ' ' + cur.mode +
        ($('rush').checked ? ' – Sugar Rush' : '') + (playing && mode() !== 'full' && mode() !== 'backing' ? ' – notes played ' + stats.hit + ', missed ' + stats.miss : '');
    }

    $('play').onclick = function () {
      A.unlock();
      var ctx = A.context;
      if (!ctx) { $('err').textContent = 'WebAudio is not available in this browser.'; return; }
      song = SONGS.list[+$('song').value];
      A.stopMusic();
      A.setZone(song.zone); A.setStyle(style); A.setLayer(song.zone); A.setRush($('rush').checked);
      bpm = ZBPM[song.zone]; $('bpm').value = bpm; $('bpmv').textContent = bpm;
      segs = [{ start: 0, song: song }]; scan = 0; events = []; stats = { hit: 0, miss: 0 }; seed = 7;
      A.ownStep(-1000); // a new set of owned steps
      A.queueSong(song.id, 0);
      t0 = ctx.currentTime + 0.25;
      A.startMusic();
      playing = true;
      clearInterval(timer); timer = setInterval(tick, 16); tick(); info();
    };
    $('stop').onclick = function () { playing = false; clearInterval(timer); timer = null; A.stopMusic(); events = []; info(); };
    // changing the song while playing: switch exactly at the next bar line (as a new segment does in the game)
    $('song').onchange = function () {
      var ns = SONGS.list[+this.value];
      if (!playing) { song = ns; info(); return; }
      var startBeat = Math.ceil(beatNow() / 4 + 0.5) * 4, startK = startBeat * 4;
      // gates already planned beyond the switch belong to the old song: drop them
      events = events.filter(function (e) { return e.b < startBeat; });
      scan = Math.min(scan, startK);
      segs = segs.filter(function (s) { return s.start < startK; });
      segs.push({ start: startK, song: ns });
      A.queueSong(ns.id, startBeat);
      A.setZone(ns.zone); A.setLayer(ns.zone);
      song = ns;
      info();
    };
    $('song').value = 0; info();

    var FX = ['puff', 'smash', 'perfect', 'pip', 'snap', 'chime', 'lolliNote', 'tickNote', 'missNote', 'crack', 'scrape', 'boing', 'aww', 'unlockJingle'];
    FX.forEach(function (n) {
      var b = document.createElement('button');
      b.textContent = n === 'tickNote' ? 'taffy ticks' : n === 'lolliNote' ? 'lollipop' : n === 'missNote' ? 'miss' : n;
      b.onclick = function () {
        A.unlock();
        if (!playing) A.setStyle(style);
        if (n === 'tickNote') { for (var j = 1; j <= 8; j++) (function (j) { setTimeout(function () { A.tickNote(null, j); }, (j - 1) * 150); })(j); }
        else if (n === 'lolliNote') A.lolliNote();
        else if (n === 'missNote') A.missNote(0);
        else A[n](3);
      };
      $('fx').appendChild(b);
    });
  }
})();
</script>
</body>
</html>
